<!-- MBQ ADMIN DASHBOARD -->

<section class="admin-dashboard">

  <div class="admin-header">
    <h2>MBQ Admin Dashboard</h2>
    <p>MBQ Pickleball Club Management System</p>
    <p>Welcome, Club Administrator!</p>
  </div>

  <!-- DASHBOARD STATISTICS -->

  <div class="dashboard-cards">

    <div class="dashboard-card">
      <h3>Total Members</h3>
      <div class="dashboard-number" id="totalMembers">
        0
      </div>
    </div>

    <div class="dashboard-card">
      <h3>Active Members</h3>
      <div class="dashboard-number" id="activeMembers">
        0
      </div>
    </div>

    <div class="dashboard-card">
      <h3>Tournaments</h3>
      <div class="dashboard-number" id="totalTournaments">
        0
      </div>
    </div>

    <div class="dashboard-card">
      <h3>Matches Played</h3>
      <div class="dashboard-number" id="totalMatches">
        0
      </div>
    </div>

  </div>

  <!-- QUICK ACTIONS -->

  <div class="dashboard-section">

    <h3>Management Menu</h3>

    <button class="dashboard-button"
      onclick="alert('Member Management coming next!')">
      Member Management
    </button>

    <button class="dashboard-button"
      onclick="alert('Tournament Management coming next!')">
      Tournament Management
    </button>

    <button class="dashboard-button"
      onclick="alert('Match Management coming next!')">
      Match Management
    </button>

    <button class="dashboard-button"
      onclick="alert('Player Rankings coming next!')">
      Player Rankings
    </button>

  </div>

  <!-- RECENT ACTIVITIES -->

  <div class="dashboard-section">

    <h3>Recent Club Activities</h3>

    <table class="dashboard-table">

      <thead>
        <tr>
          <th>Activity</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>MBQ Club Registration</td>
          <td>
            <span class="dashboard-status">
              Ready
            </span>
          </td>
        </tr>

        <tr>
          <td>Tournament Management</td>
          <td>
            <span class="dashboard-status">
              Ready
            </span>
          </td>
        </tr>

        <tr>
          <td>Match Scheduling</td>
          <td>
            <span class="dashboard-status">
              Ready
            </span>
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</section>
